name: Publish Typing Arena
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @typing-arena/web exec next build --webpack
        env:
          PAGES_BUILD: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: apps/web/out
      - name: Allow Pages artifact indexing
        run: sleep 20
      - uses: actions/deploy-pages@v4
        id: deployment
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait for artifact metadata before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - uses: actions/deploy-pages@v4
        if: steps.deployment.outcome == 'failure'
        id: retry
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
